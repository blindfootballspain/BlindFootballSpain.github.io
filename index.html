<!doctype html>
<html lang="es" data-datos="/actas/data/liga.json">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b0001e">
  <meta name="description" content="Clasificaciones, resultados y goleadores de las ligas nacionales de fútbol sala y fútbol 5 de la FEDC.">
  <title>Ligas FEDC · Resultados y clasificaciones</title>
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fuentes/montserrat-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fuentes/montserrat-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="liga.css">
</head>
<body>
  <header class="cab">
    <div class="cab-fila">
      <button class="icono-btn volver" id="volver" type="button" aria-label="Volver a las competiciones" title="Competiciones" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="logo"><img src="logo.png" alt="FEDC · Federación Española de Deportes para Ciegos"></span>
      <div class="cab-titulo"><b id="titulo">Ligas nacionales</b><small id="temporada">Fútbol sala · Fútbol 5</small></div>
      <button class="icono-btn" id="recargar" type="button" aria-label="Actualizar datos" title="Actualizar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="vista" tabindex="-1" aria-live="polite"></main>

  <nav class="barra-inf" aria-label="Secciones">
    <a href="#" data-sec="clasificacion">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>Clasificación</span>
    </a>
    <a href="#" data-sec="calendario">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M3 10h18M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>Calendario</span>
    </a>
    <a href="#" data-sec="goleadores">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7.5l4.3 3.1-1.6 5h-5.4l-1.6-5z" fill="currentColor"/></svg>
      <span>Goleadores</span>
    </a>
  </nav>

  <dialog class="hoja" id="hoja" aria-labelledby="hoja-titulo">
    <div class="hoja-asa" aria-hidden="true"></div>
    <button class="hoja-cerrar" type="button" aria-label="Cerrar">✕</button>
    <div id="hoja-contenido"></div>
  </dialog>

  <script src="liga-core.js"></script>
  <script src="liga.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
